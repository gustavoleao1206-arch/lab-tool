; ============================================================================
; Lab-Tool - Firmware integrado do dispositivo
; Placa: ESP32-S3-DevKitC-1 | Framework: Arduino
; ============================================================================
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
; Workaround do espressif32@8.0.0 (linker scripts do S3 fora do search path
; + remocao do -Map, que o ld nao cria em caminho com acento no Windows):
extra_scripts = post:add_esp32s3_ld.py
lib_deps =
    olikraus/U8g2
